[package]
name = "avs"
version = "0.3.0-alpha"
edition = "2021"
description = "Abora Vulnerability Scanner"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
